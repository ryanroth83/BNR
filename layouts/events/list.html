{{ define "main" }}
<div class="container" role="main">
 <div class="row">
    <div class="col-md-12">
      {{ with .Content }}
        <div class="well">
          {{.}}
        </div>
      {{ end }}
      <div class="row">
        {{ range .RegularPages.Reverse }}
        {{ if ge .Params.Date.Unix now.Unix }}
            {{ partial "events/event_preview" . }}
        {{ end}}
        {{ end }}
      </div>
    </div>
  </div>
  {{ partial "nav_buttons" . }}
</div>
{{ end }}
