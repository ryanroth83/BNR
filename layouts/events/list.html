{{ define "main" }}
<div class="container" role="main">
 <div class="row">
    <div class="col-md-12">
      {{ with .Content }}
        <div class="well">
          {{.}}
        </div>
      {{ end }}
      <div class="row">
        {{ range .RegularPages.Reverse }}
        {{ if ge .Params.Date.Unix now.Unix }}
            {{ partial "events/event_preview" . }}
        {{ end}}
        {{ end }}
      </div>
    </div>
  </div>
  <div class="p-2 center">
    <a href="/events/past"><button type="button" class="btn btn-dark m-2">Past Events</i></button></a>
  </div>
</div>
{{ end }}
