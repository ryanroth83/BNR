{{ define "main" }}
<div class="container" role="main">
  <div class="row">
    <div class="col-md-12">
      {{ with .Content }}
        <div class="well">
          {{.}}
        </div>
      {{ end }}
      <div class="row">
        {{ with .Parent }}
        {{ range .RegularPages }}
          {{ if le .Params.Date.Unix now.Unix }}
            {{ partial "events/event_preview" .}}
          {{ end }}
        {{ end }}
        {{ end }}
      </div>
    </div>
  </div>
  <div class="p-2 center">
    <a href="/events/"><button type="button" class="btn btn-dark m-2">Upcoming Events</button></a>
  </div>
</div>
{{ end }}
