<div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-4">
  <a href="{{ .Permalink }}">
    <div class="card single-post-card h-100 shadow-effect border">
      <div class="card-body">
        <h3 class="fw-bold post-title">{{ .Title }}</h3>
        {{ if .Params.subtitle }}
        <h3 class="post-subtitle">{{ .Params.subtitle }}</h3>
        {{ end }}
        <h4 class="post-entry">{{ .Date.Format "January 2, 2006" }}</h4>
        <h6>
          {{ .Date | time.Format ":time_short" }} {{ if .Params.end_time }} - {{
          .Params.end_time }} {{ end }}
        </h6>
        <p class="post-meta">{{ partial "post_meta_notes.html" . }}</p>
        {{ print }}
        <div class="read-more-section">
          <h6 class="text-muted link-underline">
            {{ i18n "readMore" }} <i class="bi bi-arrow-right"></i>
          </h6>
        </div>
      </div>
    </div>
  </a>
</div>
