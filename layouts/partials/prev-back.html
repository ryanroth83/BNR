{{ $leftMid := "Past Events" }}
{{ $rightMid := "Upcoming Events" }}
<div class="center m-4 p-2">
  <div class="btn-group" role="group" aria-label="Basic example">
    <button type="button" class="btn btn-dark">&larr; Previous</button>
    <button type="button" class="btn btn-dark">{{ .Parent.Params.leftMid }}</button>
    <button type="button" class="btn btn-dark">{{ .Parent.Params.rightMid }}</button>
    <button type="button" class="btn btn-dark">Next &rarr;</button>
  </div>
</div>
