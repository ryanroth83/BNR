<div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 mb-4">
  <a href="{{ .Permalink }}">
    <div class="card list-card h-100 shadow-effect border">

	<div class="card-body">

    <!--Image-->
    {{ if .Params.image }}
    <div class="py-4">
      <div class="member-card-image p-0">
        {{ with partial "get_image" . }}
          <img src="{{ .RelPermalink }}" alt="{{ .Params.name }}" class="rounded img-fluid lazyload">
        {{ end }}
      </div>
    </div>
    {{ end }}
    <!--Image-END-->

    <!--Info-->
    <div class="center mb-2">
      <h1 class="mb-0"> {{ .Params.name }} </h1>
      {{ if .Params.description }} <h6 class="mb-2"> {{ .Params.description }} </h6> {{ end }}
      {{ if .Params.position }} <h5 class="mt-4"> {{ .Params.position }} </h5> {{ end }}
      {{ if .Params.company }} <h1 class="mb-0"> {{ .Params.company }} </h1> {{ end }}
    </div>
    <!--Info-END-->

  </div>
</div>

  </a>
</div>
